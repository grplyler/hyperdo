<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Hyperdodo mascot</title>
  <desc>A plump blue-grey dodo sprinting to the right, leaning into it, juggling five checkboxes in one clean arc between its two tiny wings. Big hooked beak, pale face, fluffy tail tuft, tongue out in concentration, eyes locked on the last unticked box at the top. Four of the five are already ticked.</desc>

  <!-- Palette: blue-grey body, slate outline, pale belly and face, yellow beak with an orange hooked tip, yellow legs, one colour per tick -->
  <defs>
    <!-- UNION: head circle + body ellipse = one plump dodo. Drawn twice (fat dark, then orange) so only the outer edge gets an outline -->
    <g id="body">
      <circle cx="256" cy="272" r="84"/>
      <ellipse cx="256" cy="352" rx="104" ry="84"/>
    </g>
    <clipPath id="bodyClip"><circle cx="256" cy="272" r="84"/><ellipse cx="256" cy="352" rx="104" ry="84"/></clipPath>

    <!-- Wings, dodo-sized (tiny): left has just thrown, right is catching. Their tips are the two ends of the juggling arc -->
    <g id="wings" fill="none" stroke-linecap="round">
      <path d="M184 344 C150 340 126 320 116 288"/>
      <path d="M328 344 C362 340 386 320 396 288"/>
    </g>

    <!-- Tail: fluffy tuft, a UNION of overlapping lumps. Crest: two wisps swept back by the speed -->
    <g id="tail">
      <circle cx="132" cy="370" r="22"/>
      <circle cx="110" cy="388" r="18"/>
      <circle cx="134" cy="400" r="19"/>
      <circle cx="156" cy="384" r="20"/>
    </g>
    <g id="crest" fill="none" stroke-linecap="round">
      <path d="M250 194 Q240 172 220 166"/>
      <path d="M260 192 Q258 168 244 154"/>
    </g>

    <!-- Legs mid-stride: back one bent up with toes trailing, front one reaching for the ground -->
    <g id="legs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M234 428 L210 454 L180 440 M180 440 L164 430 M180 440 L166 450"/>
      <path d="M280 428 L310 456 L334 470 M334 470 L356 462 M334 470 L358 476 M334 470 L348 486"/>
    </g>

    <!-- SUBTRACTION: body highlight = circle minus offset circle (via mask) -->
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="194" cy="362" r="34" fill="#fff"/>
      <circle cx="205" cy="371" r="34" fill="#000"/>
    </mask>

    <!-- INTERSECTION: pupils only show where they overlap the eye -->
    <clipPath id="eyeL"><circle cx="222" cy="268" r="36"/></clipPath>
    <clipPath id="eyeR"><circle cx="290" cy="262" r="28"/></clipPath>

    <!-- INTERSECTION: the orange hook is the beak shape clipped to a circle at its tip; the pale face is an ellipse clipped to the head -->
    <path id="beakShape" d="M230 298 Q260 268 304 280 Q340 288 345 316 Q346 340 330 344 Q324 328 308 323 Q266 328 230 314 Z"/>
    <clipPath id="beakClip"><use href="#beakShape"/></clipPath>
    <clipPath id="headClip"><circle cx="256" cy="272" r="84"/></clipPath>

    <!-- Reusable bits, centred on 0,0: checkbox, tick, sweat drop (round end leads), loose feather -->
    <rect id="box" x="-24" y="-24" width="48" height="48" rx="10" fill="#fff4e0" stroke="#2b3440" stroke-width="8"/>
    <path id="tick" d="M-12 1 L-4 11 L14 -12" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="drop" d="M0 -14 C9 0 9 10 0 10 C-9 10 -9 0 0 -14 Z" fill="#8fd0f0" stroke="#2b3440" stroke-width="6" stroke-linejoin="round"/>
    <path id="feather" d="M0 -18 C12 -6 12 8 0 18 C-12 8 -12 -6 0 -18 Z" fill="#6f8494" stroke="#2b3440" stroke-width="6" stroke-linejoin="round"/>
  </defs>

  <!-- LEFT BEHIND: speed lines, dust from the last footfall, two shed feathers -->
  <path d="M22 350 H70 M14 388 H58" fill="none" stroke="#bccad4" stroke-width="7" stroke-linecap="round"/>
  <g fill="#fff4e0" stroke="#2b3440" stroke-width="7">
    <circle cx="112" cy="478" r="16"/>
    <circle cx="82" cy="472" r="11"/>
    <circle cx="138" cy="488" r="10"/>
  </g>
  <use href="#feather" transform="translate(40 310) rotate(70)"/>
  <use href="#feather" transform="translate(44 432) rotate(105) scale(0.8)"/>

  <!-- THE BIRD, leaning 6 degrees into the run; the juggling arc leans with it -->
  <g transform="rotate(6 256 380)">
    <!-- Flight path of the boxes: one circle through both wing tips, and wing whooshes -->
    <g fill="none" stroke="#bccad4" stroke-width="7" stroke-linecap="round">
      <path d="M116 288 A161 161 0 1 1 396 288" stroke-dasharray="2 20"/>
      <path d="M88 330 Q80 306 90 282 M70 322 Q65 304 72 286"/>
      <path d="M424 330 Q432 306 422 282 M442 322 Q447 304 440 286"/>
    </g>

    <use href="#tail" fill="#2b3440" stroke="#2b3440" stroke-width="16"/>
    <use href="#tail" fill="#eef2f5"/>
    <use href="#crest" stroke="#2b3440" stroke-width="22"/>
    <use href="#crest" stroke="#6f8494" stroke-width="9"/>

    <!-- CHECKBOXES on the arc, left to right: just thrown, rising, apex (still unticked), falling, caught -->
    <g transform="translate(97 187) rotate(-24)"><use href="#box"/><use href="#tick" stroke="#2a9d8f"/></g>
    <g transform="translate(136 101) rotate(14)"><use href="#box"/><use href="#tick" stroke="#f0b429"/></g>
    <g transform="translate(256 48) rotate(-8)"><use href="#box"/></g>
    <g transform="translate(376 101) rotate(22)"><use href="#box"/><use href="#tick" stroke="#e8607a"/></g>
    <g transform="translate(400 244) rotate(-10)"><use href="#box"/><use href="#tick" stroke="#7b5ea7"/></g>

    <!-- WINGS (the right one overlaps the box it has caught) + LEGS -->
    <use href="#wings" stroke="#2b3440" stroke-width="46"/>
    <use href="#wings" stroke="#93a6b5" stroke-width="30"/>
    <use href="#legs" stroke="#2b3440" stroke-width="25"/>
    <use href="#legs" stroke="#f0b429" stroke-width="12"/>

    <!-- BODY, highlight, cream belly clipped to it -->
    <use href="#body" fill="#2b3440" stroke="#2b3440" stroke-width="20" stroke-linejoin="round"/>
    <use href="#body" fill="#93a6b5"/>
    <g mask="url(#crescent)"><circle cx="194" cy="362" r="34" fill="#bccad4"/></g>
    <g clip-path="url(#bodyClip)"><ellipse cx="256" cy="398" rx="66" ry="62" fill="#eef2f5"/></g>
    <g clip-path="url(#headClip)"><ellipse cx="264" cy="286" rx="72" ry="54" fill="#f6ecd9"/></g>

    <!-- CHEEK (the other one is behind the beak) -->
    <circle cx="186" cy="322" r="16" fill="#f58fa0" opacity="0.8"/>

    <!-- EYES: mismatched, both locked on the unticked box overhead -->
    <circle cx="222" cy="268" r="36" fill="#fff" stroke="#2b3440" stroke-width="8"/>
    <g clip-path="url(#eyeL)">
      <circle cx="231" cy="253" r="22" fill="#2b3440"/>
      <circle cx="239" cy="245" r="8" fill="#fff"/>
      <circle cx="224" cy="261" r="3.5" fill="#fff"/>
    </g>
    <circle cx="290" cy="262" r="28" fill="#fff" stroke="#2b3440" stroke-width="8"/>
    <g clip-path="url(#eyeR)">
      <circle cx="294" cy="250" r="17" fill="#2b3440"/>
      <circle cx="300" cy="244" r="6" fill="#fff"/>
      <circle cx="289" cy="256" r="3" fill="#fff"/>
    </g>

    <!-- EYEBROWS, kept inside the head: one shot up in panic, one set in determination -->
    <path d="M196 224 Q214 206 240 216" fill="none" stroke="#2b3440" stroke-width="8" stroke-linecap="round"/>
    <path d="M272 224 Q288 224 306 215" fill="none" stroke="#2b3440" stroke-width="8" stroke-linecap="round"/>

    <!-- BEAK: the dodo's big hooked bill, pointing the way he's running. Lower jaw, tongue, then the upper bill with its orange hook and a nostril -->
    <path d="M240 316 Q278 330 314 326 Q300 350 262 344 Q244 338 240 316 Z" fill="#e09a1f" stroke="#2b3440" stroke-width="8" stroke-linejoin="round"/>
    <ellipse cx="300" cy="344" rx="10" ry="13" fill="#f58fa0" stroke="#2b3440" stroke-width="7" transform="rotate(-30 300 344)"/>
    <use href="#beakShape" fill="#f3cf6b" stroke="#2b3440" stroke-width="8" stroke-linejoin="round"/>
    <g clip-path="url(#beakClip)"><circle cx="338" cy="322" r="27" fill="#e0703f"/></g>
    <use href="#beakShape" fill="none" stroke="#2b3440" stroke-width="8" stroke-linejoin="round"/>
    <ellipse cx="296" cy="296" rx="6" ry="3.5" fill="#2b3440" transform="rotate(12 296 296)"/>

    <!-- SWEAT flung off the back of the head: round end leads, tail points back at the bird -->
    <use href="#drop" transform="translate(152 196) rotate(135)"/>
    <use href="#drop" transform="translate(146 240) rotate(110) scale(0.7)"/>
    <use href="#drop" transform="translate(186 150) rotate(160) scale(0.75)"/>
  </g>
</svg>
