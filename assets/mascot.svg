<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Hyperdo mascot</title>
  <desc>A small round orange bird sprinting to the right, leaning into it, while juggling five checkboxes in one clean arc from wing to wing. Crest and tail stream behind, sweat and a couple of feathers fly off the back, tongue out in concentration, eyes locked on the last unticked box at the top. Four of the five are already ticked.</desc>

  <!-- Palette: orange body, dark brown outline, cream belly, yellow beak and legs, one colour per tick -->
  <defs>
    <!-- UNION: head circle + body ellipse = one round bird. Drawn twice (fat dark, then orange) so only the outer edge gets an outline -->
    <g id="body">
      <circle cx="256" cy="272" r="84"/>
      <ellipse cx="256" cy="352" rx="104" ry="84"/>
    </g>
    <clipPath id="bodyClip"><circle cx="256" cy="272" r="84"/><ellipse cx="256" cy="352" rx="104" ry="84"/></clipPath>

    <!-- Wings: left has just thrown, right is catching. Their tips are the two ends of the juggling arc -->
    <g id="wings" fill="none" stroke-linecap="round">
      <path d="M178 340 C132 330 104 298 98 256"/>
      <path d="M334 340 C380 330 408 298 414 256"/>
    </g>

    <!-- Tail and crest, both swept back by the speed -->
    <g id="tail" fill="none" stroke-linecap="round">
      <path d="M176 392 Q140 372 108 376"/>
      <path d="M174 404 Q134 400 96 410"/>
      <path d="M180 416 Q146 428 116 446"/>
    </g>
    <g id="crest" fill="none" stroke-linecap="round">
      <path d="M246 196 Q232 168 204 160"/>
      <path d="M256 194 Q250 160 228 140"/>
      <path d="M266 196 Q270 164 258 144"/>
    </g>

    <!-- Legs mid-stride: back one bent up with toes trailing, front one reaching for the ground -->
    <g id="legs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M234 428 L210 454 L180 440 M180 440 L164 430 M180 440 L166 450"/>
      <path d="M280 428 L310 456 L334 470 M334 470 L356 462 M334 470 L358 476 M334 470 L348 486"/>
    </g>

    <!-- SUBTRACTION: body highlight = circle minus offset circle (via mask) -->
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="194" cy="362" r="34" fill="#fff"/>
      <circle cx="205" cy="371" r="34" fill="#000"/>
    </mask>

    <!-- INTERSECTION: pupils only show where they overlap the eye -->
    <clipPath id="eyeL"><circle cx="220" cy="274" r="40"/></clipPath>
    <clipPath id="eyeR"><circle cx="296" cy="270" r="32"/></clipPath>

    <!-- Reusable bits, centred on 0,0: checkbox, tick, sweat drop (round end leads), loose feather -->
    <rect id="box" x="-24" y="-24" width="48" height="48" rx="10" fill="#fff4e0" stroke="#4a2418" stroke-width="8"/>
    <path id="tick" d="M-12 1 L-4 11 L14 -12" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="drop" d="M0 -14 C9 0 9 10 0 10 C-9 10 -9 0 0 -14 Z" fill="#8fd0f0" stroke="#4a2418" stroke-width="6" stroke-linejoin="round"/>
    <path id="feather" d="M0 -18 C12 -6 12 8 0 18 C-12 8 -12 -6 0 -18 Z" fill="#c2603f" stroke="#4a2418" stroke-width="6" stroke-linejoin="round"/>
  </defs>

  <!-- LEFT BEHIND: speed lines, dust from the last footfall, two shed feathers -->
  <path d="M22 350 H70 M14 388 H58" fill="none" stroke="#f2a082" stroke-width="7" stroke-linecap="round"/>
  <g fill="#fff4e0" stroke="#4a2418" stroke-width="7">
    <circle cx="112" cy="478" r="16"/>
    <circle cx="82" cy="472" r="11"/>
    <circle cx="138" cy="488" r="10"/>
  </g>
  <use href="#feather" transform="translate(40 310) rotate(70)"/>
  <use href="#feather" transform="translate(44 432) rotate(105) scale(0.8)"/>

  <!-- THE BIRD, leaning 6 degrees into the run; the juggling arc leans with it -->
  <g transform="rotate(6 256 380)">
    <!-- Flight path of the boxes: one circle through both wing tips, and wing whooshes -->
    <g fill="none" stroke="#f2a082" stroke-width="7" stroke-linecap="round">
      <path d="M98 256 A164 164 0 1 1 414 256" stroke-dasharray="2 20"/>
      <path d="M70 300 Q62 272 72 246 M52 292 Q47 272 54 252"/>
      <path d="M442 300 Q450 272 440 246 M460 292 Q465 272 458 252"/>
    </g>

    <use href="#tail" stroke="#4a2418" stroke-width="28"/>
    <use href="#tail" stroke="#c2603f" stroke-width="14"/>
    <use href="#crest" stroke="#4a2418" stroke-width="22"/>
    <use href="#crest" stroke="#c2603f" stroke-width="9"/>

    <!-- CHECKBOXES on the arc, left to right: just thrown, rising, apex (still unticked), falling, caught -->
    <g transform="translate(94 184) rotate(-24)"><use href="#box"/><use href="#tick" stroke="#2a9d8f"/></g>
    <g transform="translate(130 107) rotate(14)"><use href="#box"/><use href="#tick" stroke="#f0b429"/></g>
    <g transform="translate(256 48) rotate(-8)"><use href="#box"/></g>
    <g transform="translate(382 107) rotate(22)"><use href="#box"/><use href="#tick" stroke="#e8607a"/></g>
    <g transform="translate(420 210) rotate(-10)"><use href="#box"/><use href="#tick" stroke="#7b5ea7"/></g>

    <!-- WINGS (the right one overlaps the box it has caught) + LEGS -->
    <use href="#wings" stroke="#4a2418" stroke-width="46"/>
    <use href="#wings" stroke="#D97757" stroke-width="30"/>
    <use href="#legs" stroke="#4a2418" stroke-width="21"/>
    <use href="#legs" stroke="#f0b429" stroke-width="9"/>

    <!-- BODY, highlight, cream belly clipped to it -->
    <use href="#body" fill="#4a2418" stroke="#4a2418" stroke-width="20" stroke-linejoin="round"/>
    <use href="#body" fill="#D97757"/>
    <g mask="url(#crescent)"><circle cx="194" cy="362" r="34" fill="#f2a082"/></g>
    <g clip-path="url(#bodyClip)"><ellipse cx="256" cy="398" rx="66" ry="62" fill="#fff4e0"/></g>

    <!-- CHEEKS -->
    <circle cx="182" cy="326" r="17" fill="#f58fa0" opacity="0.8"/>
    <circle cx="332" cy="322" r="17" fill="#f58fa0" opacity="0.8"/>

    <!-- EYES: huge, mismatched, both locked on the unticked box overhead -->
    <circle cx="220" cy="274" r="40" fill="#fff4e0" stroke="#4a2418" stroke-width="8"/>
    <g clip-path="url(#eyeL)">
      <circle cx="230" cy="258" r="25" fill="#4a2418"/>
      <circle cx="239" cy="249" r="9" fill="#fff4e0"/>
      <circle cx="222" cy="267" r="4" fill="#fff4e0"/>
    </g>
    <circle cx="296" cy="270" r="32" fill="#fff4e0" stroke="#4a2418" stroke-width="8"/>
    <g clip-path="url(#eyeR)">
      <circle cx="300" cy="256" r="20" fill="#4a2418"/>
      <circle cx="307" cy="249" r="7" fill="#fff4e0"/>
      <circle cx="294" cy="263" r="3.5" fill="#fff4e0"/>
    </g>

    <!-- EYEBROWS, kept inside the head: one shot up in panic, one set in determination -->
    <path d="M196 226 Q214 208 242 218" fill="none" stroke="#4a2418" stroke-width="8" stroke-linecap="round"/>
    <path d="M276 229 Q294 229 312 219" fill="none" stroke="#4a2418" stroke-width="8" stroke-linecap="round"/>

    <!-- BEAK: small, with the tongue poking out the side in concentration -->
    <ellipse cx="274" cy="329" rx="11" ry="14" fill="#f58fa0" stroke="#4a2418" stroke-width="7" transform="rotate(-24 274 329)"/>
    <path d="M232 311 Q258 291 284 311 Q258 333 232 311 Z" fill="#f0b429" stroke="#4a2418" stroke-width="8" stroke-linejoin="round"/>

    <!-- SWEAT flung off the back of the head: round end leads, tail points back at the bird -->
    <use href="#drop" transform="translate(152 196) rotate(135)"/>
    <use href="#drop" transform="translate(146 240) rotate(110) scale(0.7)"/>
    <use href="#drop" transform="translate(186 150) rotate(160) scale(0.75)"/>
  </g>
</svg>
